name: PSE Scorecard (nightly)

# Sprint-26 §26.1: nightly run that regenerates docs/pse/scorecard.json
# from the live benchmark suite. Internal-only until Cut-Off 2 (Owner-
# Decision D1 soft-launch). Once SQL on Spider-easy crosses 15 %, the
# regression-check step starts blocking PRs that drop a domain score.

on:
  schedule:
    # Every day at 03:17 UTC. Off-peak, doesn't collide with the
    # release-publish workflow.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      domains:
        description: "Comma-separated subset of domains to evaluate (empty = all)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Sanity (no GPU eval yet — Sprint-26.1 internal only)
        run: |
          # Sprint-26.1 ships only the harness scaffolding. Real
          # benchmark runs happen on a dedicated GPU runner that the
          # owner triggers manually via workflow_dispatch starting in
          # 26.2. Until then, this job validates that the scorecard
          # JSON parses and the regression-check helper is importable.
          python -c "
          from pathlib import Path
          from cognithor.channels.program_synthesis.domains.scorecard import Scorecard
          card = Scorecard.load_json(Path('docs/pse/scorecard.json'))
          print(f'Loaded {len(card.entries)} scorecard entries')
          assert len(card.entries) >= 10, 'baseline scoreboard incomplete'
          "

      - name: Regression check (no-op on baseline run)
        run: |
          python -c "
          from pathlib import Path
          from cognithor.channels.program_synthesis.domains.scorecard import Scorecard
          baseline = Scorecard.load_json(Path('docs/pse/scorecard.json'))
          current = Scorecard.load_json(Path('docs/pse/scorecard.json'))
          regs = current.regression_check(baseline)
          if regs:
              print('REGRESSION:')
              for r in regs:
                  print(f'  - {r}')
              raise SystemExit(1)
          print('No regressions vs baseline.')
          "
